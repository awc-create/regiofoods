# Local Postgres for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: regio
    ports:
      - '5432:5432'
    volumes:
      - regio_pg:/var/lib/postgresql/data

volumes:
  regio_pg:
